name: Publish RunPod image

on:
  push:
    branches:
      - codex/compliance
    paths:
      - .github/workflows/publish-runpod-image.yml
      - Dockerfile
      - "*.py"
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runpod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish RunPod worker
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sdavignon/h3-cog:runpod
            ghcr.io/sdavignon/h3-cog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Record immutable image
        run: echo "ghcr.io/sdavignon/h3-cog@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
